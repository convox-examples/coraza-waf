# =============================================================================
# Paranoia Level Override
# =============================================================================
# This file is loaded AFTER crs-setup.conf but BEFORE the CRS rules, via the
# plugins/*-before.conf include in the Caddyfile. This ensures our paranoia
# settings take effect regardless of what activate-rules.sh does to crs-setup.conf.
#
# The config.d/ directory loads BEFORE crs-setup.conf, so paranoia settings
# placed there can be overwritten. The plugins/ directory is the correct
# location for paranoia level overrides.
#
# Change the values below to adjust your paranoia level.
# See: https://coreruleset.org/docs/concepts/paranoia_levels/

SecAction "id:1000002,phase:1,nolog,pass,t:none,setvar:tx.blocking_paranoia_level=1,setvar:tx.detection_paranoia_level=1"
